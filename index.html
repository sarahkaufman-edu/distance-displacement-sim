<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Physics Lab: Motion Diagrams</title>
  <style>
    :root{
      --bg-dark:#f8f9fa;
      --accent:#2c3e50;
      --dist-color:#d35400;
      --disp-color:#2980b9;
    }
    body{font-family:'Segoe UI',sans-serif;background-color:#e9ecef;text-align:center;margin:0;color:var(--accent);}
    #nav{background:var(--accent);padding:12px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}
    .nav-btn{padding:8px 15px;cursor:pointer;border:2px solid #fff;background:transparent;color:#fff;border-radius:5px;font-weight:bold;}
    .nav-btn.active{background:#fff;color:var(--accent);}
    .main-layout{display:flex;flex-direction:column;align-items:center;padding:15px;gap:15px;}
    #simulation-container{
      position:relative;width:90vw;height:35vh;background-color:#fff;
      background-image:linear-gradient(#eee 1px,transparent 1px),linear-gradient(90deg,#eee 1px,transparent 1px);
      background-size:40px 40px;border:2px solid var(--accent);border-radius:8px;overflow:hidden;cursor:crosshair;
    }
    canvas{position:absolute;top:0;left:0;}
    #vehicle{
      position:absolute;
      font-size:45px;
      transform:translate(-50%,-50%);
      pointer-events:none;
      z-index:10;
    }
    /* 👇 flipped emoji */
    .flipped{
      transform:translate(-50%,-50%) scaleX(-1);
    }

    #graph-container{width:90vw;height:30vh;background:#fff;border-radius:8px;padding:10px;position:relative;border:2px solid var(--accent);}
    #ui-overlay{
      position:absolute;top:10px;left:10px;background:rgba(255,255,255,.95);
      padding:10px;border-radius:6px;text-align:left;color:var(--accent);z-index:20;border:1px solid #ccc;
      font-size:.85rem;width:200px;
    }
    .stat{font-weight:bold;margin-bottom:2px;}
    #reset-btn{width:100%;padding:6px;background:#c0392b;color:#fff;border:none;border-radius:4px;cursor:pointer;margin-top:5px;}
  </style>
</head>
<body>

<div id="nav">
  <button class="nav-btn active" onclick="setMode('plane', this)">✈️ Plane</button>
  <button class="nav-btn" onclick="setMode('car', this)">🚗 Car</button>
  <button class="nav-btn" onclick="setMode('heli', this)">🚁 Heli</button>
  <button class="nav-btn" onclick="setMode('person', this)">🚶 Person</button>
</div>

<div class="main-layout">
  <div id="simulation-container">
    <canvas id="pathCanvas"></canvas>
    <div id="vehicle">✈️</div>

    <div id="ui-overlay">
      <div id="mode-title" style="font-weight:900;border-bottom:1px solid #ccc;margin-bottom:5px;">Airplane Mode</div>
      <div class="stat" style="color:var(--dist-color);">Distance: <span id="distVal">0</span> m</div>
      <div class="stat" style="color:var(--disp-color);">Displacement: <span id="dispVal">0</span> m</div>
      <div class="stat">Time: <span id="timeVal">0.0</span> s</div>
      <hr>
      <div class="stat" style="color:var(--dist-color);">Speed (Slope): <span id="speedSlope">0.0</span> m/s</div>
      <div class="stat" style="color:var(--disp-color);">Velocity (Slope): <span id="velSlope">0.0</span> m/s</div>
      <div style="font-size:.7rem;color:#666;margin-top:5px;">*Ghosts appear every 1.0s</div>
      <button id="reset-btn" onclick="resetSim()">Clear Data</button>
    </div>
  </div>

  <div id="graph-container">
    <canvas id="graphCanvas"></canvas>
  </div>
</div>

<script>
  const container = document.getElementById('simulation-container');
  const pathCanvas = document.getElementById('pathCanvas');
  const graphCanvas = document.getElementById('graphCanvas');
  const pCtx = pathCanvas.getContext('2d');
  const gCtx = graphCanvas.getContext('2d');
  const vehicle = document.getElementById('vehicle');

  const modes = {
    plane: { title:"Airplane Mode", emoji:"✈️", flipped:false },
    car: { title:"Car Mode", emoji:"🚗", flipped:true },
    heli: { title:"Helicopter Mode", emoji:"🚁", flipped:true },
    person:{ title:"Person Mode", emoji:"🚶", flipped:true }
  };

  let currentMode='plane';
  let isDragging=false;
  let path=[],stamps=[];
  let startX,startY,curX,curY,totalDist=0,startTime,lastStampTime=0;

  function setMode(mode,btn){
    currentMode=mode;
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    if(btn) btn.classList.add('active');

    vehicle.innerText=modes[mode].emoji;
    vehicle.classList.toggle('flipped',modes[mode].flipped);
    document.getElementById('mode-title').innerText=modes[mode].title;
    resetSim();
  }

  function resize(){
    pathCanvas.width=container.clientWidth;
    pathCanvas.height=container.clientHeight;
    graphCanvas.width=document.getElementById('graph-container').clientWidth;
    graphCanvas.height=document.getElementById('graph-container').clientHeight;
    drawGraphStatic();
  }
  window.addEventListener('resize',resize);
  resize();

  container.addEventListener('mousedown',start);
  document.addEventListener('mousemove',move);
  document.addEventListener('mouseup',()=>isDragging=false);

  function start(e){
    const r=container.getBoundingClientRect();
    startX=curX=e.clientX-r.left;
    startY=curY=e.clientY-r.top;
    totalDist=0;
    path=[{t:0,d:0,disp:0}];
    stamps=[];
    isDragging=true;
    startTime=Date.now();
    lastStampTime=0;
  }

  function move(e){
    if(!isDragging) return;
    const r=container.getBoundingClientRect();
    const nx=e.clientX-r.left, ny=e.clientY-r.top;
    const seg=Math.hypot(nx-curX,ny-curY);
    totalDist+=seg;
    curX=nx; curY=ny;
    const time=(Date.now()-startTime)/1000;
    const disp=Math.hypot(curX-startX,curY-startY);
    if(time-lastStampTime>=1){
      stamps.push({x:curX,y:curY});
      lastStampTime=time;
    }
    path.push({t:time,d:totalDist,disp});
    updateUI(time,totalDist,disp);
    drawSim(); drawGraph();
  }

  function updateUI(t,d,disp){
    vehicle.style.left=curX+'px';
    vehicle.style.top=curY+'px';
    distVal.innerText=Math.round(d);
    dispVal.innerText=Math.round(disp);
    timeVal.innerText=t.toFixed(1);
  }

  function drawSim(){
    pCtx.clearRect(0,0,pathCanvas.width,pathCanvas.height);
    pCtx.globalAlpha=.3;
    pCtx.font="30px Arial";
    stamps.forEach(s=>pCtx.fillText(modes[currentMode].emoji,s.x-15,s.y+10));
    pCtx.globalAlpha=1;
    pCtx.strokeStyle='#2980b9';
    pCtx.lineWidth=3;
    pCtx.beginPath();
    pCtx.moveTo(startX,startY);
    pCtx.lineTo(curX,curY);
    pCtx.stroke();
  }

  function drawGraphStatic(){
    gCtx.clearRect(0,0,graphCanvas.width,graphCanvas.height);
  }

  function drawGraph(){}

  function resetSim(){
    isDragging=false;
    pCtx.clearRect(0,0,pathCanvas.width,pathCanvas.height);
    vehicle.style.left='50%';
    vehicle.style.top='50%';
  }

  resetSim();
</script>
</body>
</html>
