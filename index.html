<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Sim: Car vs. Plane</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #2c3e50; text-align: center; margin: 0; color: white; }
        
        /* Navigation Menu */
        #nav { background: #1a252f; padding: 15px; display: flex; justify-content: center; gap: 20px; }
        .nav-btn { padding: 10px 20px; cursor: pointer; border: 2px solid #3498db; background: transparent; color: white; border-radius: 5px; font-weight: bold; }
        .nav-btn.active { background: #3498db; }

        #simulation-container { 
            position: relative; width: 90vw; height: 60vh; margin: 20px auto; 
            border: 4px solid white; border-radius: 12px; overflow: hidden;
            background-size: cover; background-position: center;
        }

        canvas { position: absolute; top: 0; left: 0; z-index: 5; }
        #vehicle { position: absolute; font-size: 50px; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; }

        #ui-overlay { 
            position: absolute; top: 15px; left: 15px; background: rgba(255, 255, 255, 0.9); 
            padding: 15px; border-radius: 8px; text-align: left; color: #2c3e50; z-index: 20; min-width: 200px;
        }
        .stat { margin-bottom: 5px; font-weight: bold; }
        #reset-btn { margin-top: 10px; padding: 10px 20px; background: #e74c3c; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div id="nav">
    <button class="nav-btn active" onclick="setMode('plane')">✈️ Airplane Mode</button>
    <button class="nav-btn" onclick="setMode('car')">🚗 Car Mode</button>
</div>

<div id="simulation-container" id="simBox">
    <canvas id="pathCanvas"></canvas>
    <div id="vehicle">✈️</div>
    
    <div id="ui-overlay">
        <div id="mode-title" style="font-size: 1.2rem; border-bottom: 2px solid #ccc; margin-bottom: 10px;">Airplane Mission</div>
        <div class="stat" style="color: #d35400;">Distance: <span id="distVal">0</span> m</div>
        <div class="stat" style="color: #2980b9;">Displacement: <span id="dispVal">0</span> m</div>
        <div class="stat">Time: <span id="timeVal">0.0</span> s</div>
        <div class="stat" id="speedStat">Avg Speed: 0 m/s</div>
        <button id="reset-btn" onclick="resetSim()">Reset Data</button>
    </div>
</div>

<script>
    const container = document.getElementById('simulation-container');
    const canvas = document.getElementById('pathCanvas');
    const ctx = canvas.getContext('2d');
    const vehicle = document.getElementById('vehicle');
    
    // Modes Data
    const modes = {
        plane: {
            title: "Airplane Mission",
            emoji: "✈️",
            bg: "url('https://images.unsplash.com/photo-1506012733851-bb9215d3974d?q=80&w=2074&auto=format&fit=crop')",
            desc: "Fly freely! Displacement is the straight-line vector."
        },
        car: {
            title: "Car Mission",
            emoji: "🚗",
            bg: "url('https://images.unsplash.com/photo-1526649661456-89c7ed4d00b8?q=80&w=2000&auto=format&fit=crop')",
            desc: "Follow the roads! Notice how distance grows faster than displacement."
        }
    };

    let currentMode = 'plane';
    let isDragging = false;
    let path = [];
    let startX, startY, curX, curY, distance = 0, startTime;

    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        
        container.style.backgroundImage = modes[mode].bg;
        vehicle.innerText = modes[mode].emoji;
        document.getElementById('mode-title').innerText = modes[mode].title;
        resetSim();
    }

    // Initialize Plane Mode
    setMode('plane');

    function resize() {
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    container.addEventListener('mousedown', (e) => {
        const rect = container.getBoundingClientRect();
        startX = e.clientX - rect.left;
        startY = e.clientY - rect.top;
        curX = startX; curY = startY;
        path = [{x: startX, y: startY}];
        distance = 0;
        isDragging = true;
        startTime = Date.now();
    });

    document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const rect = container.getBoundingClientRect();
        const nx = e.clientX - rect.left;
        const ny = e.clientY - rect.top;

        const dx = nx - curX;
        const dy = ny - curY;
        distance += Math.sqrt(dx*dx + dy*dy);
        
        curX = nx; curY = ny;
        path.push({x: curX, y: curY});
        update();
    });

    document.addEventListener('mouseup', () => isDragging = false);

    function update() {
        vehicle.style.left = curX + 'px';
        vehicle.style.top = curY + 'px';

        const disp = Math.sqrt(Math.pow(curX - startX, 2) + Math.pow(curY - startY, 2));
        const time = (Date.now() - startTime) / 1000;

        document.getElementById('distVal').innerText = Math.round(distance);
        document.getElementById('dispVal').innerText = Math.round(disp);
        document.getElementById('timeVal').innerText = time.toFixed(1);
        document.getElementById('speedStat').innerText = "Avg Speed: " + (distance/time).toFixed(1) + " m/s";

        draw();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Path
        ctx.beginPath();
        ctx.setLineDash([5, 5]);
        ctx.strokeStyle = '#d35400';
        ctx.lineWidth = 3;
        ctx.moveTo(path[0].x, path[0].y);
        for(let p of path) ctx.lineTo(p.x, p.y);
        ctx.stroke();

        // Displacement Vector
        ctx.setLineDash([]);
        ctx.strokeStyle = '#2980b9';
        ctx.lineWidth = 4;
        const headlen = 15;
        const angle = Math.atan2(curY - startY, curX - startX);
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(curX, curY);
        ctx.stroke();
    }

    function resetSim() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        path = [];
        distance = 0;
        document.getElementById('distVal').innerText = "0";
        document.getElementById('dispVal').innerText = "0";
        document.getElementById('timeVal').innerText = "0.0";
    }
</script>
</body>
</html>
