<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Lab: Motion Diagrams</title>
    <style>
        :root {
            --bg-dark: #f8f9fa;
            --accent: #2c3e50;
            --dist-color: #d35400;
            --disp-color: #2980b9;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: #e9ecef; text-align: center; margin: 0; color: var(--accent); }
        
        #nav { background: var(--accent); padding: 12px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .nav-btn { padding: 8px 15px; cursor: pointer; border: 2px solid #fff; background: transparent; color: white; border-radius: 5px; font-weight: bold; }
        .nav-btn.active { background: #fff; color: var(--accent); }

        .main-layout { display: flex; flex-direction: column; align-items: center; padding: 15px; gap: 15px; }

        #simulation-container { 
            position: relative; width: 90vw; height: 35vh; 
            background-color: white;
            background-image: linear-gradient(#eee 1px, transparent 1px), linear-gradient(90deg, #eee 1px, transparent 1px);
            background-size: 40px 40px;
            border: 2px solid var(--accent); border-radius: 8px; overflow: hidden; cursor: crosshair;
        }
        canvas { position: absolute; top: 0; left: 0; }
        #vehicle { position: absolute; font-size: 45px; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; }

        #graph-container { 
            width: 90vw; height: 30vh; background: white; border-radius: 8px; 
            padding: 10px; position: relative; border: 2px solid var(--accent);
        }

        #ui-overlay { 
            position: absolute; top: 10px; left: 10px; background: rgba(255, 255, 255, 0.95); 
            padding: 10px; border-radius: 6px; text-align: left; color: var(--accent); z-index: 20; border: 1px solid #ccc; font-size: 0.85rem; width: 200px;
        }
        .stat { font-weight: bold; margin-bottom: 2px; }
        #reset-btn { width: 100%; padding: 6px; background: #c0392b; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 5px; }
    </style>
</head>
<body>

<div id="nav">
    <button class="nav-btn active" onclick="setMode('plane')">✈️ Plane</button>
    <button class="nav-btn" onclick="setMode('car')">🚗 Car</button>
    <button class="nav-btn" onclick="setMode('heli')">🚁 Heli</button>
    <button class="nav-btn" onclick="setMode('person')">🚶 Person</button>
</div>

<div class="main-layout">
    <div id="simulation-container">
        <canvas id="pathCanvas"></canvas>
        <div id="vehicle">✈️</div>
        <div id="ui-overlay">
            <div id="mode-title" style="font-weight: 900; border-bottom: 1px solid #ccc; margin-bottom: 5px;">Airplane Mode</div>
            <div class="stat" style="color: var(--dist-color);">Distance: <span id="distVal">0</span> m</div>
            <div class="stat" style="color: var(--disp-color);">Displacement: <span id="dispVal">0</span> m</div>
            <div class="stat">Time: <span id="timeVal">0.0</span> s</div>
            <hr>
            <div class="stat" style="color: var(--dist-color);">Speed (Slope): <span id="speedSlope">0.0</span> m/s</div>
            <div class="stat" style="color: var(--disp-color);">Velocity (Slope): <span id="velSlope">0.0</span> m/s</div>
            <div style="font-size: 0.7rem; color: #666; margin-top: 5px;">*Ghosts appear every 1.0s</div>
            <button id="reset-btn" onclick="resetSim()">Clear Data</button>
        </div>
