<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Lab: Motion & Graphing</title>
    <style>
        :root {
            --bg-dark: #f8f9fa;
            --accent: #2c3e50;
            --dist-color: #d35400;
            --disp-color: #2980b9;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: #e9ecef; text-align: center; margin: 0; color: var(--accent); }
        
        #nav { background: var(--accent); padding: 15px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .nav-btn { padding: 10px 18px; cursor: pointer; border: 2px solid #fff; background: transparent; color: white; border-radius: 5px; font-weight: bold; transition: 0.2s; }
        .nav-btn:hover { background: rgba(255,255,255,0.1); }
        .nav-btn.active { background: #fff; color: var(--accent); }

        .main-layout { display: flex; flex-direction: column; align-items: center; padding: 20px; gap: 20px; }

        /* The Simulation Grid */
        #simulation-container { 
            position: relative; width: 90vw; height: 40vh; 
            background-color: white;
            /* Creates a physics grid background */
            background-image: linear-gradient(#eee 1px, transparent 1px), linear-gradient(90deg, #eee 1px, transparent 1px);
            background-size: 40px 40px;
            border: 2px solid var(--accent); border-radius: 8px; overflow: hidden; cursor: crosshair;
        }
        canvas { position: absolute; top: 0; left: 0; }
        #vehicle { position: absolute; font-size: 45px; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; }

        /* The Graph Area */
        #graph-container { 
            width: 90vw; height: 35vh; background: white; border-radius: 8px; 
            padding: 10px; position: relative; border: 2px solid var(--accent);
        }

        #ui-overlay { 
            position: absolute; top: 10px; left: 10px; background: rgba(255, 255, 255, 0.9); 
            padding: 12px; border-radius: 6px; text-align: left; color: var(--accent); z-index: 20; border: 1px solid #ccc; font-size: 0.9rem;
        }
        .stat { font-weight: bold; margin-bottom: 2px; }
        #reset-btn { width: 100%; padding: 8px; background: #c0392b; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 5px; }
    </style>
</head>
<body>

    <button class="nav-btn" onclick="setMode('car')">🚗 Car</button>
