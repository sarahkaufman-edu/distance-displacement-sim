<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distance vs. Displacement Sim</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f8ff; text-align: center; margin: 0; overflow: hidden; }
        #header { background: #2c3e50; color: white; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        #simulation-container { position: relative; width: 90vw; height: 70vh; margin: 20px auto; background: white; border: 3px solid #34495e; border-radius: 10px; cursor: crosshair; overflow: hidden; }
        canvas { position: absolute; top: 0; left: 0; }
        #ui-overlay { position: absolute; top: 10px; left: 10px; background: rgba(255, 255, 255, 0.9); padding: 15px; border-radius: 8px; text-align: left; pointer-events: none; border: 1px solid #ccc; }
        .stat { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; }
        .dist { color: #e67e22; } /* Orange for path */
        .disp { color: #2980b9; } /* Blue for vector */
        #controls { margin-bottom: 20px; }
        button { padding: 10px 20px; font-size: 1rem; cursor: pointer; background: #27ae60; color: white; border: none; border-radius: 5px; transition: 0.3s; }
        button:hover { background: #2ecc71; }
        #heli { position: absolute; font-size: 40px; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; transition: transform 0.1s; }
    </style>
</head>
<body>

<div id="header">
    <h1>Physics Sim: Distance vs. Displacement</h1>
    <p>Standard PS.FM.1: Drag the helicopter to see the difference!</p>
</div>

<div id="simulation-container" id="simBox">
    <canvas id="pathCanvas"></canvas>
    <div id="heli">🚁</div>
    <div id="ui-overlay">
        <div class="stat dist">Distance (Scalar): <span id="distVal">0</span> m</div>
        <div class="stat disp">Displacement (Vector): <span id="dispVal">0</span> m</div>
        <hr>
        <small>Orange line = Path taken<br>Blue arrow = Net change</small>
    </div>
</div>

<div id="controls">
    <button onclick="resetSim()">Reset Flight</button>
</div>

<script>
    const container = document.getElementById('simulation-container');
    const canvas = document.getElementById('pathCanvas');
    const ctx = canvas.getContext('2d');
    const heli = document.getElementById('heli');
    const distText = document.getElementById('distVal');
    const dispText = document.getElementById('dispVal');

    let startX, startY, currentX, currentY;
    let distance = 0;
    let isDragging = false;
    let path = [];

    // Resize canvas to fit container
    function resize() {
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    container.addEventListener('mousedown', startFlight);
    container.addEventListener('mousemove', flying);
    window.addEventListener('mouseup', endFlight);

    function startFlight(e) {
        const rect = container.getBoundingClientRect();
        startX = e.clientX - rect.left;
        startY = e.clientY - rect.top;
        currentX = startX;
        currentY = startY;
        
        path = [{x: startX, y: startY}];
        distance = 0;
        isDragging = true;
        
        updateHeli(startX, startY);
        draw();
    }

    function flying(e) {
        if (!isDragging) return;
        const rect = container.getBoundingClientRect();
        const newX = e.clientX - rect.left;
        const newY = e.clientY - rect.top;

        // Calculate incremental distance
        const dx = newX - currentX;
        const dy = newY - currentY;
        distance += Math.sqrt(dx * dx + dy * dy);

        currentX = newX;
        currentY = newY;
        path.push({x: currentX, y: currentY});

        updateHeli(currentX, currentY);
        calculateDisplacement();
        draw();
    }

    function endFlight() {
        isDragging = false;
    }

    function updateHeli(x, y) {
        heli.style.left = x + 'px';
        heli.style.top = y + 'px';
    }

    function calculateDisplacement() {
        const dx = currentX - startX;
        const dy = currentY - startY;
        const displacement = Math.sqrt(dx * dx + dy * dy);
        
        distText.innerText = Math.round(distance);
        dispText.innerText = Math.round(displacement);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Distance Path (Orange)
        ctx.beginPath();
        ctx.setLineDash([5, 5]);
        ctx.strokeStyle = '#e67e22';
        ctx.lineWidth = 2;
        if(path.length > 0) ctx.moveTo(path[0].x, path[0].y);
        for(let i=1; i<path.length; i++) {
            ctx.lineTo(path[i].x, path[i].y);
        }
        ctx.stroke();

        // Draw Displacement Vector (Blue Arrow)
        if (path.length > 1) {
            ctx.setLineDash([]);
            ctx.strokeStyle = '#2980b9';
            ctx.lineWidth = 4;
            drawArrow(startX, startY, currentX, currentY);
        }
    }

    function drawArrow(fromx, fromy, tox, toy) {
        const headlen = 15;
        const dx = tox - fromx;
        const dy = toy - fromy;
        const angle = Math.atan2(dy, dx);
        ctx.beginPath();
        ctx.moveTo(fromx, fromy);
        ctx.lineTo(tox, toy);
        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(tox, toy);
        ctx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
        ctx.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));
        ctx.closePath();
        ctx.fillStyle = '#2980b9';
        ctx.fill();
    }

    function resetSim() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        path = [];
        distance = 0;
        distText.innerText = '0';
        dispText.innerText = '0';
        heli.style.left = '50%';
        heli.style.top = '50%';
    }
</script>

</body>
</html>
